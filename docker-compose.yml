services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: friday-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: friday-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: friday-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
